<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫咪追踪系统 - Cat Tracking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app">
        <!-- 顶部标题栏 -->
        <header class="top-header">
            <h1>🐱 猫咪追踪系统</h1>
            <div class="header-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">就绪</span>
            </div>
        </header>

        <!-- 主内容区域：横向排列 -->
        <div class="content-row">
            <!-- 左侧：视频流（占大部分） -->
            <div class="video-panel">
                <div class="video-wrapper">
                    <img id="video-stream" src="/video_feed" alt="Camera Stream">
                    <div class="video-overlay" id="video-overlay">
                        <div class="overlay-content">
                            <svg class="camera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                </path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <p>RealSense相机视频流</p>
                            <button id="start-camera-btn" class="btn btn-secondary">启动相机</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧栏 -->
            <div class="side-panel">
                <section class="card teleop-card" aria-labelledby="teleop-title">
                    <div class="card-header">
                        <h2 id="teleop-title">🎮 键盘驾驶</h2>
                        <span id="teleop-status" class="teleop-status" role="status">正在连接底盘通信…</span>
                    </div>
                    <div class="teleop-keys" aria-label="键位说明">
                        <span data-drive-key="KeyW"><kbd>W</kbd> 前进</span>
                        <span data-drive-key="KeyS"><kbd>S</kbd> 后退</span>
                        <span data-drive-key="KeyA"><kbd>A</kbd> 左移</span>
                        <span data-drive-key="KeyD"><kbd>D</kbd> 右移</span>
                        <span data-drive-key="KeyJ"><kbd>J</kbd> 左转</span>
                        <span data-drive-key="KeyK"><kbd>K</kbd> 右转</span>
                    </div>
                    <div class="teleop-speeds">
                        <label for="teleop-linear">移动速度 <output id="teleop-linear-value" for="teleop-linear">0.20 m/s</output>
                            <input id="teleop-linear" type="range" min="0.05" max="0.50" step="0.05" value="0.20">
                        </label>
                        <label for="teleop-angular">转向速度 <output id="teleop-angular-value" for="teleop-angular">0.50 rad/s</output>
                            <input id="teleop-angular" type="range" min="0.10" max="1.00" step="0.10" value="0.50">
                        </label>
                    </div>
                    <div class="button-group">
                        <button id="teleop-toggle" class="btn btn-primary" type="button" aria-pressed="false" disabled>启用键盘驾驶</button>
                        <button id="teleop-stop" class="btn btn-danger" type="button" disabled>停止（空格）</button>
                    </div>
                    <p class="teleop-hint">先取消 RViz 中的导航任务，再启用驾驶。按住移动，松开停止；支持组合键。切换窗口或点击 RViz 后需重新启用。</p>
                </section>

                <!-- VNC 远程桌面（小块） -->
                <div class="card">
                    <div class="card-header">
                        <h2>🖥️ 远程桌面 (RViz)</h2>
                        <div class="vnc-status">
                            <span class="status-dot ready" id="vnc-status-dot"></span>
                            <span id="ros-status-text">VNC (:0)</span>
                        </div>
                    </div>
                    <div class="vnc-container" id="vnc-container">
                        <iframe id="vnc-frame"
                            src="http://{{ request.host.split(':')[0] }}:6080/vnc.html?autoconnect=true&resize=scale&view_only=false"
                            style="width: 100%; height: 100%; border: none;"></iframe>
                    </div>
                </div>

                <!-- 上传区域 -->
                <div class="card">
                    <h2>🎯 追踪控制</h2>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="file-input" accept="image/*" style="display: none;">
                        <div class="upload-placeholder" id="upload-placeholder">
                            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>点击选择或拖拽猫照片</p>
                            <p class="file-types">JPG / PNG / GIF / BMP</p>
                        </div>
                        <div id="preview-container" class="preview-container" style="display: none;">
                            <img id="preview-image" src="" alt="预览">
                            <button id="remove-image" class="remove-btn">✕</button>
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="upload-btn" class="btn btn-primary" disabled>上传照片</button>
                    </div>
                    <div class="button-group" style="margin-top: 8px;">
                        <button id="start-btn" class="btn btn-success" disabled>🚀 启动追踪</button>
                        <button id="stop-btn" class="btn btn-danger" disabled>⏹ 停止追踪</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='teleop.js') }}"></script>
</body>

</html>
